server {
    listen 80;
    server_name www.ducknap.games;
    return 301 https://ducknap.games$request_uri;
}
server {
    listen 80 default_server;
    server_name ducknap.games;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    # No raw access logs: send only page path and a broad source group to the
    # loopback collector. It discards assets, unknown routes and health probes.
    access_log syslog:server=127.0.0.1:9514,tag=website_statistics,nohostname website_statistics if=$statistics_count;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    if ($request_uri ~ "^(.*/)index\.html(?:\?.*)?$") {
        return 301 https://ducknap.games$1$is_args$args;
    }
    location = /privacy.html { return 301 https://ducknap.games/games/whose-stuff/privacy/; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ =404; }
}
