# Runs in nginx's http context. Only broad source categories leave this process.
map $http_user_agent $statistics_bot {
    default 0;
    "" 1;
    ~*(bot|crawler|spider|slurp|preview|facebookexternalhit|curl|wget|python|DuckNapSiteCheck|HeadlessChrome|healthcheck) 1;
}
map "$request_method:$status:$statistics_bot:$http_dnt:$http_sec_gpc" $statistics_count {
    default 0;
    ~^GET:200:0:(|0):(|0)$ 1;
}
map $http_referer $statistics_referrer {
    default "Other referral";
    "" "Direct / unknown";
    ~*^https?://(www\.)?(ducknap\.games|ducknap\.com|ducknapgames\.com|ducknapgames\.github\.io)([:/]|$) "Internal navigation";
    ~*^https?://([a-z0-9-]+\.)*(google\.(com|[a-z][a-z]|com\.[a-z][a-z]|co\.[a-z][a-z])|googleusercontent\.com)([:/]|$) "Google";
    ~*^https?://([a-z0-9-]+\.)*bing\.com([:/]|$) "Bing";
    ~*^https?://([a-z0-9-]+\.)*instagram\.com([:/]|$) "Instagram";
    ~*^https?://([a-z0-9-]+\.)*facebook\.com([:/]|$) "Facebook";
    ~*^https?://([a-z0-9-]+\.)*tiktok\.com([:/]|$) "TikTok";
    ~*^https?://([a-z0-9-]+\.)*(youtube\.com|youtu\.be)([:/]|$) "YouTube";
    ~*^https?://([a-z0-9-]+\.)*(x\.com|twitter\.com|t\.co)([:/]|$) "X";
    ~*^https?://([a-z0-9-]+\.)*linkedin\.com([:/]|$) "LinkedIn";
    ~*^https?://([a-z0-9-]+\.)*github\.com([:/]|$) "GitHub";
}
map $arg_utm_source $statistics_source {
    default $statistics_referrer;
    ~*^(instagram|ig)$ "Instagram";
    ~*^(facebook|fb)$ "Facebook";
    ~*^tiktok$ "TikTok";
    ~*^(youtube|yt)$ "YouTube";
    ~*^(x|twitter)$ "X";
    ~*^google$ "Google";
    ~*^bing$ "Bing";
    ~*^linkedin$ "LinkedIn";
    ~*^github$ "GitHub";
}
# nginx internally resolves a directory request to index.html before logging.
map $uri $statistics_page {
    default $uri;
    ~^(?<statistics_directory>.*)/index\.html$ $statistics_directory/;
}
log_format website_statistics escape=json '{"page":"$statistics_page","source":"$statistics_source"}';
