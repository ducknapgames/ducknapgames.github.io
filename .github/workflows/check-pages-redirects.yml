name: Check Pages redirects
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-pages-redirects.py'
      - 'scripts/test-pages-redirects.py'
      - 'sitemap.xml'
      - '.github/workflows/check-pages-redirects.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/check-site.py
      - run: python scripts/check-locales.py
      - run: python scripts/test-pages-redirects.py
